<title>니모디 · NimOdi v2.4</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--ink:#202b3e;--muted:#78869b;--line:#dde5ee;--pink:#ef497b;--pink-dark:#cf285f;--desk:#e2e9f2;--desk-border:#9aabc0;--green:#287c58}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:3px solid #f35b90;outline-offset:2px}
.shell{max-width:1750px;height:100vh;height:100dvh;min-height:0;margin:auto;padding:clamp(8px,1.4vh,17px) clamp(8px,1.4vw,22px);display:flex;flex-direction:column;gap:10px}
.top{height:49px;flex:none;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:39px;width:39px;border-radius:12px;background:#ffecf2;color:#e33470;display:grid;place-items:center}
.logo svg{width:22px;height:22px}
.brand-name{font-size:26px;font-weight:850;letter-spacing:-.065em}
.brand-latin{font-size:12px;font-weight:750;color:#8895a6;margin-left:8px;letter-spacing:0}
.version{font-size:10px;font-weight:800;letter-spacing:.02em;color:#8b98a9;background:#edf1f7;border-radius:100px;padding:4px 8px}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 266px;gap:12px}
.map-panel,.share-panel{background:white;border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 34px rgba(42,62,92,.045);min-height:0}
.map-panel{display:flex;flex-direction:column;overflow:hidden}
.toolbar{height:52px;flex:none;border-bottom:1px solid #e9eef5;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
.instruction{display:flex;align-items:center;gap:9px;font-weight:790;font-size:14px;white-space:nowrap}
.dot{height:8px;width:8px;border-radius:50%;background:var(--pink);flex:none}
.tools{display:flex;align-items:center;gap:10px;min-width:0}
.legend{display:flex;gap:11px;color:#79889b;font-size:11px;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:5px}
.key{width:13px;height:12px;border-radius:3px;border:1px solid var(--desk-border);background:var(--desk)}
.key.space{background:#ebeffb;border-color:#a7aed0}
.key.active{background:var(--pink);border-color:var(--pink-dark)}
.jump{max-width:126px;font-size:11px;border:1px solid #dbe3ed;border-radius:9px;padding:7px 8px;background:#f8fafc;color:#41536d}
.zoom{display:flex;align-items:center;padding:2px;border:1px solid #dfe7f0;background:#f6f8fc;border-radius:10px;gap:2px}
.zoom button{height:27px;min-width:25px;padding:0 5px;border:0;border-radius:7px;background:transparent;color:#45546c;font-size:17px}
.zoom button:hover:not(:disabled){background:#e7edf7}
.zoom button:disabled{opacity:.3;cursor:default}
.zoom .fit{font-size:11px;font-weight:750;padding:0 6px}
.viewport{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden;background:#fcfdff;overscroll-behavior:contain;scrollbar-color:#cbd4e0 #f7f9fc}
.center{display:grid;place-items:center}
.map-canvas{flex:none}
#floor-map{display:block;height:100%;width:100%;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}

.partition{fill:#fff0e8;stroke:#e9bca7;stroke-width:1.5;pointer-events:none}
.partition-text{fill:#9d593b;font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.floor-block{fill:#eaf7ef;stroke:#b6ddc5;stroke-width:1.8}
.floor-btn{cursor:pointer;outline:none}
.floor-btn rect{fill:#fff;stroke:#b2d4bf;stroke-width:1.7;transition:fill .12s ease}
.floor-btn text{fill:#377658;font-size:27px;font-weight:850;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.floor-btn[aria-pressed="true"] rect{fill:#2b825e;stroke:#1c6c4b;stroke-width:2.5}
.floor-btn[aria-pressed="true"] text{fill:#fff}
.floor-btn:hover:not([aria-pressed="true"]) rect{fill:#d9efe2}
.floor-btn:focus-visible rect{stroke:#ec497c;stroke-width:4}
.desk-half{fill:var(--desk);cursor:pointer;transition:fill .1s ease;outline:none}
.desk-half:hover{fill:#f7c2d3}
.desk-half.is-selected,.desk-half.is-selected:hover{fill:var(--pink)}
.desk-half:focus-visible{stroke:#be275a;stroke-width:2;paint-order:stroke}
.desk-outline{fill:none;stroke:var(--desk-border);stroke-width:1.8;pointer-events:none}
.desk-mid{stroke:#a5b2c1;stroke-width:1.2;pointer-events:none}
.area{cursor:pointer;outline:none}
.area rect.shape{stroke-width:1.8;transition:fill .12s ease,stroke .12s ease}
.area.room rect.shape{fill:#eef0fb;stroke:#a6afd2}
.area.study rect.shape{fill:#eff3f8;stroke:#abb9ce}
.area.sofa rect.shape{fill:#fff2e8;stroke:#d7ae90}

.area:focus-visible rect.shape{stroke:#b3235b;stroke-width:4}
.room-title{font-size:14px;font-weight:760;fill:#7a86a0;pointer-events:none}

.share-panel{display:flex;flex-direction:column;padding:20px;gap:0}
.panel-label{color:#8b98aa;font-size:12px;font-weight:760;margin:0 0 21px}
.status{display:flex;align-items:flex-start;gap:11px;min-width:0}
.pin{height:39px;width:39px;flex:none;border-radius:12px;background:#f0f3f7;color:#95a2b5;display:grid;place-items:center}
.pin svg{width:21px;height:21px}
.ready .pin{background:#ffebf1;color:#dc316b}
.status-title{font-size:15px;font-weight:800;line-height:1.45;word-break:keep-all}
.status-note{font-size:12px;color:#7c8999;line-height:1.5;margin-top:5px;word-break:keep-all}
.space-tag{display:none;color:#c72b63;font-size:11px;font-weight:760;margin-top:6px}
.ready .space-tag{display:block}
.grow{flex:1;min-height:14px}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
.action{height:43px;border-radius:10px;background:white;border:1px solid #dee6ef;color:#44556d;font-weight:760;font-size:13px}
.action.primary{color:#fff;background:var(--pink);border-color:var(--pink)}
.action:not(:disabled):hover{filter:brightness(.97)}
.action:disabled{opacity:.4;cursor:not-allowed}
.reset{align-self:flex-start;background:none;border:0;color:#8291a4;font-size:12px;font-weight:720;margin-top:9px;padding:2px 0}
.reset:disabled{opacity:.5;cursor:not-allowed}
.help{margin-top:14px;border-top:1px solid #edf0f4;padding-top:13px;color:#97a2b0;font-size:11px;line-height:1.6}
.feedback{font-size:11px;color:#53677a;line-height:1.5;margin-top:11px;min-height:32px;word-break:keep-all}
.feedback.ok{color:#17855a}.feedback.warn{color:#ab6040}

 .version{font-size:9px}
 .map-panel{border-radius:13px}

 .legend{display:none}

 .share-panel{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 10px}

 .status-note{font-size:10px}
 .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}

 .reset{grid-column:1;justify-self:start;font-size:11px}

@media(prefers-reduced-motion:reduce){.desk-half,.area rect.shape,.floor-btn rect{transition:none}}

  'M932 129 H1064',
  'M932 174 H1064'
  ],open:[
   'M360 399 V354 H404 V399',
   'M404 399 V354 H448 V399',
   'M448 399 V354 H492 V399'
  ]},
 5:{outer:'M8 10 H1064 V566 H8 Z',walls:[
  'M360 10 V221 L405 251',
  'M360 251 V296 H756 V431 L801 461',
  'M756 461 V566',
  'M933 176 V221 H1021 V401 H1064',
  'M976 506 H1064 V566',
  'M976 506 V566',
  'M492 10 V176 H889 V10',
  'M755 10 V176',
  'M755 86 H889',
  'M933 10 V176',
  'M933 71 H1064',
  'M933 132 H1064',
  'M933 176 H1064'
  ],open:[]}
};
const customPolys={
 4:{wall:'M976 174 H1064 V414 H1021 V219 H976 Z'},
 5:{wall:'M933 176 H1064 V401 H1021 V221 H933 Z'}
};
const areaById={4:new Map(A[4].map(o=>[o[0],o])),5:new Map(A[5].map(o=>[o[0],o]))};
function svg(tag,attributes={},parent=map){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attributes))n.setAttribute(k,String(v));parent.append(n);return n;}
function label(str,props={},parent=map){const n=svg('text',props,parent);n.textContent=str;return n;}
function gridBackground(){svg('rect',{x:0,y:0,width:W,height:H,fill:'#fcfdff'});}
function floorPicker(){
 const s=svg('g',{'aria-label':'층 선택'});
 svg('rect',{x:492,y:10,width:263,height:165,rx:0,class:'floor-block'},s);
 for(let i=0;i<2;i++){
  const f=4+i,x=530+i*100,y=63;
  const g=svg('g',{id:'floor'+f,class:'floor-btn',role:'button',tabindex:0,'aria-label':`${f}층 보기`,'aria-pressed':String(state.floor===f)},s);
  svg('rect',{x,y,width:91,height:65,rx:9},g);label(f+'층',{x:x+45.5,y:y+35},g);
 }
}
function drawAreas(){
 const g=svg('g',{'aria-label':'선택할 수 있는 공간'});
 A[state.floor].forEach(([id,name,x,y,w,h,type,lines,font])=>{
  const key='loc:'+id;
  const node=svg('g',{class:'area '+type,'data-key':key,role:'button',tabindex:0,'aria-label':`${state.floor}층 ${name}`,'aria-pressed':'false'},g);
  svg('title',{},node).textContent=name;
  if(customPolys[state.floor]?.[id])svg('path',{class:'shape is-l-shaped',d:customPolys[state.floor][id]},node);
  else svg('rect',{class:'shape',x,y,width:w,height:h,rx:0},node);
  let cx=x+w/2,cy=y+h/2;
  if(id==='wall'){cx=state.floor===4?1042:1042;cy=state.floor===4?310:311;}
  const lh=font*1.12;
  const t=svg('text',{x:cx,y:cy-(lines.length-1)*lh/2,'font-size':font},node);
  lines.forEach((str,i)=>{svg('tspan',{x:cx,dy:i?lh:0},t).textContent=str;});
  uiMap.set(key,node);
 });
}
function drawDesks(){
 const parent=svg('g',{'aria-label':'책상 좌석'});
 for(const [group,x,y,num] of D[state.floor]){
  const w=44,h=30,r=1.2;
  for(let col=0;col<num;col++){
   const px=x+col*w,container=svg('g',{},parent);
   for(let side=0;side<2;side++){
    const key=`${group}.${side}.${col}`;
    const half=svg('rect',{x:px+.6,y:y+side*15+.4,width:w-1.2,height:14.7,rx:0.2,class:'desk-half','data-key':key,role:'button',tabindex:0,'aria-pressed':'false','aria-label':`${state.floor}층 책상 ${side===0?'위쪽':'아래쪽'} 자리`},container);
    uiMap.set(key,half);
   }
   svg('rect',{x:px,y,width:w,height:h,rx:r,class:'desk-outline'},container);
   svg('line',{x1:px,y1:y+15,x2:px+w,y2:y+15,class:'desk-mid'},container);
  }
 }
 // Old layouts contained an additional desk in one historical group. Resolve those old links
 // to the nearest current desk rather than showing a nonexistent desk on the clean source plan.
 if(state.floor===4){
   for(let side=0;side<2;side++)uiMap.set(`h.${side}.2`,uiMap.get(`h.${side}.1`));
 } else{
   for(let side=0;side<2;side++)uiMap.set(`n.${side}.0`,uiMap.get(`h.${side}.5`));
 }
}
function drawWalls(){
 const g=svg('g',{'aria-hidden':'true'}),o=STRUCT[state.floor];
 svg('path',{d:o.outer,class:'wall'},g);
 o.walls.forEach(d=>svg('path',{d,class:'wall'},g));
 o.open.forEach(d=>svg('path',{d,class:'wall-sub'},g));
 // Visually show the stair entrance as a separate enclosed square, never a sofa or generic rectangle.
}
function drawPartition(){
 const f=state.floor;const y=f===4?265:266,h=30;
 svg('rect',{x:8,y,width:352,height:h,class:'partition'});
 label('접이식 파티션',{x:184,y:y+h/2,class:'partition-text'});
}
function render(){
 uiMap.clear();map.replaceChildren();map.setAttribute('aria-label',state.floor+'층 위치 안내도');
 gridBackground();drawAreas();drawDesks();floorPicker();drawPartition();drawWalls();
 refresh();updateQuick();
}
function seatAlias(key){
 if(!key)return null;
 if(state.floor===4&&/^h\.[01]\.2$/.test(key))return key.slice(0,-1)+'1';
 if(state.floor===5&&/^n\.[01]\.0$/.test(key))return key[2]==='0'?'h.0.5':'h.1.5';
 return key;
}
function hashFor(floor,key){
 if(!key)return '';
 if(key.startsWith('loc:'))return `#${floor}@${key.slice(4)}`;
 const index=legacy[floor].indexOf(key);
 return index<0?'':`#${floor}-${index.toString(36)}`;
}
function decodeHash(){
 let raw;try{raw=decodeURIComponent(location.hash.slice(1));}catch{return null;}
 let m=raw.match(/^([45])@([a-zA-Z0-9]+)$/);
 if(m&&areaById[+m[1]].has(m[2]))return {floor:+m[1],key:'loc:'+m[2]};
 m=raw.match(/^([45])-([0-9a-z]{1,3})$/i);
 if(m){const floor=+m[1],key=legacy[floor][parseInt(m[2],36)];if(key)return {floor,key};}
 return null;
}
function locationName(){return state.key?.startsWith('loc:')?areaById[state.floor].get(state.key.slice(4))?.[1]??'공간':'책상 자리';}
function refresh(){
 const selectedNode=uiMap.get(seatAlias(state.key));
 for(const node of new Set(uiMap.values())){
  const on=!!selectedNode&&node===selectedNode;
  node.classList.toggle('is-selected',on);
  node.setAttribute('aria-pressed',String(on));
 }
 for(const f of [4,5]){const node=el('floor'+f);if(node)node.setAttribute('aria-pressed',String(state.floor===f));}
 const active=!!state.key;
 el('share-panel').classList.toggle('ready',active);
 ['copy-link','copy-message','reset'].forEach(id=>{el(id).disabled=!active;});
 el('instruction').textContent=state.received?'공유된 위치를 확인하세요':'위치를 선택해 주세요';
 el('status-title').textContent=active?`${state.floor}층 · ${locationName()}`:'위치 선택 전';
 el('status-note').textContent=active?(state.received?'분홍색으로 표시된 위치입니다.':'링크를 복사해 공유하세요.'):'지도에서 좌석이나 장소를 눌러주세요.';
 el('space-tag').textContent=active?(state.key.startsWith('loc:')?'공간 위치':'책상 자리'):'';
 el('jump').value=state.key?.startsWith('loc:')?`${state.floor}@${state.key.slice(4)}`:'';
}
function notice(msg='',kind=''){el('feedback').textContent=msg;el('feedback').className='feedback'+(kind?' '+kind:'');}
function choose(key){
 state.key=(state.key===key&&!state.received)?null:key;state.received=false;
 const u=new URL(location.href);u.search='';u.hash=hashFor(state.floor,state.key);history.replaceState(null,'',u);
 refresh();notice();
}
function setFloor(floor){
 if(state.floor===floor)return;
 state.floor=floor;state.key=null;state.received=false;state.zoom=1;
 const u=new URL(location.href);u.hash='';u.search='';history.replaceState(null,'',u);
 render();fit();notice();
}
function updateQuick(){
 const select=el('jump');select.replaceChildren(new Option('공간 바로가기',''));
 for(const f of [4,5]){
  const group=document.createElement('optgroup');group.label=f+'층';
  const seen={};
  A[f].forEach(([id,name])=>{
   seen[name]=(seen[name]||0)+1;
   const title=['마주보기 소파 부스','로비 탁자','사물함'].includes(name)?`${name} (${seen[name]})`:name;
   group.append(new Option(title,`${f}@${id}`));
  });select.append(group);
 }
 select.value=state.key?.startsWith('loc:')?`${state.floor}@${state.key.slice(4)}`:'';
}
function fit(){
 const aw=stage.clientWidth,ah=stage.clientHeight;if(aw<2||ah<2)return;
 const k=Math.min((aw-12)/W,(ah-12)/H),w=W*k*state.zoom,h=H*k*state.zoom;
 canvas.style.width=w+'px';canvas.style.height=h+'px';
 center.style.width=Math.max(aw,w)+'px';center.style.height=Math.max(ah,h)+'px';
 stage.style.overflow=state.zoom===1?'hidden':'auto';
 el('out').disabled=state.zoom<=1;el('in').disabled=state.zoom>=4;
 if(state.zoom>1){let rx=.5,ry=.5;const node=uiMap.get(seatAlias(state.key));
  if(node){const b=node.getBBox();rx=Math.max(0,Math.min(1,(b.x+b.width/2)/W));ry=Math.max(0,Math.min(1,(b.y+b.height/2)/H));}
  stage.scrollLeft=Math.max(0,(Math.max(aw,w)-aw)*rx);stage.scrollTop=Math.max(0,(Math.max(ah,h)-ah)*ry);
 }else{stage.scrollLeft=0;stage.scrollTop=0;}
}
function start(){
 const p=decodeHash();state.floor=p?.floor||4;state.key=p?.key||null;state.received=!!p;state.zoom=1;
 render();fit();notice();
}
function shareURL(){const url=new URL(location.href);url.search='';url.hash=hashFor(state.floor,state.key);return url.href;}
async function clipboard(text){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch{}
 const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-99999px;top:0';document.body.append(field);field.select();
 let okay=false;try{okay=document.execCommand('copy');}catch{}field.remove();return okay;
}
async function share(asMessage){
 if(!state.key)return;
 const loc=locationName(),url=shareURL();
 const msg=`📍 니모디 · ${state.floor}층${state.key.startsWith('loc:')?' · '+loc:''}, 저 여기 있어요!\n${url}`;
 const ok=await clipboard(asMessage?msg:url);
 if(!ok)notice('복사할 수 없습니다. 브라우저 권한을 확인해 주세요.','warn');
 else if(location.protocol==='file:')notice('복사했습니다. 다른 사람에게 보내려면 GitHub Pages에 업로드하세요.','warn');
 else notice(asMessage?'메시지를 복사했습니다.':'링크를 복사했습니다.','ok');
}
map.addEventListener('click',event=>{
 const item=event.target.closest?.('[data-key],.floor-btn');if(!item)return;
 if(item.classList.contains('floor-btn'))setFloor(Number(item.id.slice(-1)));else choose(item.dataset.key);
});
map.addEventListener('keydown',event=>{
 if(event.key!=='Enter'&&event.key!==' ')return;
 const item=event.target.closest?.('[data-key],.floor-btn');if(!item)return;event.preventDefault();
 if(item.classList.contains('floor-btn'))setFloor(Number(item.id.slice(-1)));else choose(item.dataset.key);
});
el('jump').addEventListener('change',e=>{
 if(!e.target.value)return;
 const [f,id]=e.target.value.split('@');
 if(Number(f)!==state.floor){setFloor(Number(f));}
 choose('loc:'+id);
});
el('reset').addEventListener('click',()=>choose(state.key));
el('copy-link').addEventListener('click',()=>share(false));
el('copy-message').addEventListener('click',()=>share(true));
el('in').addEventListener('click',()=>{state.zoom=Math.min(4,state.zoom+.25);fit();});
el('out').addEventListener('click',()=>{state.zoom=Math.max(1,state.zoom-.25);fit();});
el('fit').addEventListener('click',()=>{state.zoom=1;fit();});
window.addEventListener('hashchange',start);
window.addEventListener('resize',fit);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(stage);
start();
})();
</script>
